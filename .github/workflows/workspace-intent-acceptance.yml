name: Workspace production acceptance
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: workspace-intent-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the headless browser
        run: |
          pnpm exec playwright install chromium --only-shell
          if ! node -e 'require("@playwright/test").chromium.launch().then(browser => browser.close()).catch(() => process.exit(1))'; then
            pnpm exec playwright install-deps chromium
          fi
      - name: Install Chinese typefaces for visual acceptance
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c
          for family in Sans Serif; do
            font="Noto${family}CJKsc-Regular.otf"
            curl -fsSL --retry 2 --max-time 90 "$base/$family/OTF/SimplifiedChinese/$font" -o "$HOME/.local/share/fonts/$font"
          done
          fc-cache "$HOME/.local/share/fonts"
      - name: Verify the dedicated smoke account
        run: pnpm exec tsx smoke-tests/verify-live-summary-account.ts
        env:
          TEST_LIVE_SUMMARY_EMAIL: ${{ secrets.TEST_LIVE_SUMMARY_EMAIL }}
          TEST_LIVE_SUMMARY_PASSWORD: ${{ secrets.TEST_LIVE_SUMMARY_PASSWORD }}
          TEST_NON_ADMIN_EMAIL: ${{ secrets.TEST_NON_ADMIN_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Walk the deployed project journey
        run: pnpm exec playwright test smoke-tests/e2e-workspace-intent-production.spec.ts --config playwright.production.config.ts --workers=1 --retries=0 --reporter=list
        env:
          BASE_URL: https://www.youtubeai.chat
          RUN_WORKSPACE_INTENT_LIVE: '1'
          TEST_LIVE_SUMMARY_EMAIL: ${{ secrets.TEST_LIVE_SUMMARY_EMAIL }}
          TEST_LIVE_SUMMARY_PASSWORD: ${{ secrets.TEST_LIVE_SUMMARY_PASSWORD }}
          TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
      - name: Preserve isolated project visual and citation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workspace-intent
          path: test-results/workspace-intent/
          if-no-files-found: ignore
          retention-days: 7
