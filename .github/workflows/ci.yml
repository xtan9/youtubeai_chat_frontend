      - name: Project analytics contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_analytics.sql
      - name: Project analytics concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_analytics_concurrency.sql
      - name: Video identity and cache access contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_video_identity_access.sql
      - name: Video identity concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_video_identity_concurrency.sql
      - name: Catalog Admission contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_catalog_admission.sql
      - name: Catalog Admission concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_catalog_admission_concurrency.sql
      - name: Structured Semantic Profile activation gate - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_structured_semantic_profiles.sql
      - name: Structured Semantic Profile activation concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_structured_semantic_profiles_concurrency.sql
