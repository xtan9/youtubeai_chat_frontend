<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>城南图书馆 · 写作空间</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ec;color:#242f29;font:15px/1.65 system-ui,sans-serif}header,main{max-width:1390px;margin:auto;padding:20px 4vw}header{border-bottom:1px solid #c9cec5;display:flex;align-items:center;gap:18px}small,label{color:#516458}h1{font:600 clamp(26px,3vw,42px)/1.25 Georgia,serif;margin:0}h2{font-size:16px;margin:0 0 16px}main{display:grid;grid-template-columns:minmax(150px,.65fr) minmax(260px,1.75fr) minmax(260px,1.2fr);gap:14px}section{background:#fffefa;border:1px solid #d5d8cf;border-radius:12px;padding:22px;min-width:0}aside{font-size:14px}summary,button{cursor:pointer}details{margin:12px 0}button{border:1px solid #cad2c9;background:#fffefa;color:#274438;padding:7px 12px;border-radius:7px;font:inherit}button:hover,button[aria-pressed=true]{background:#e4efe4}button:disabled{opacity:.5;cursor:default}.primary{background:#245640;color:white}.primary:hover{background:#356d55}#draft{width:100%;min-height:290px;resize:vertical;border:0;background:transparent;font:19px/1.95 Georgia,serif;color:inherit}#draft:focus{outline:1px dashed #95aa98}#draft::selection,mark{background:#c9e4b4;color:#13291c}#paper{position:relative}#mirror{position:absolute;inset:0;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;padding:2px;font:19px/1.95 Georgia,serif;background:#fffefa;overflow:hidden}#mirror[hidden]{display:none}#chip,blockquote{background:#edf4e9;border-left:3px solid #69966b;padding:8px 12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}#chip button{float:right;padding:0 6px}#ask{width:100%;font:inherit;padding:10px;border:1px solid #bac5b9;border-radius:7px;margin:8px 0}#thread{max-height:350px;overflow:auto}article{border-top:1px solid #ddd;padding:10px 0}article p{margin:6px 0}#notice{color:#31583f} @media(max-width:820px){main{grid-template-columns:1fr}#draft{min-height:190px}}
nav{display:grid;gap:4px;margin:8px 0 22px}nav button{text-align:left;border:0;background:transparent}nav button[aria-current=page]{background:#deeadf;font-weight:600}#title{width:100%;border:0;background:transparent;color:inherit;font:inherit}aside details small{display:block}
#paper{margin-top:20px}
#actions{position:absolute;z-index:2;display:flex;gap:2px;padding:3px;background:#fffefa;border:1px solid #c1cec1;border-radius:8px;box-shadow:0 3px 12px #273e2520}
#actions[hidden]{display:none}#actions button{border:0;font-size:13px;padding:4px 9px}

</style><header><strong>写作空间</strong><span>／ 城南图书馆</span><small>原型 · 模拟素材与回复</small></header><main>
<aside><h2>项目文稿</h2><nav id="documents" aria-label="项目文稿"></nav><button id="newDoc">＋ 空白文稿</button><hr><h2>参考资料</h2>
<details><summary>闭馆前的一个小时</summary><small>现场笔记</small>五点，窗边还有三个人。管理员给一位读者留了盏灯。</details>
<details><summary>旧馆平面图</summary><small>PDF · 第 2 页</small>阅览室朝西，借阅台靠近南门。</details>
<details><summary>图书馆的开放时间</summary><small>网页 · 公告摘录</small>工作日下午五点半闭馆。</details>
<details><summary>管理员的一天</summary><small>YouTube · 访谈摘录</small>“每天最后一件事，是把窗边的椅子推回去。”</details></aside>
<section><label for="title">文稿标题</label><h1><input id="title" placeholder="无标题" aria-label="文稿标题"></h1><div id="paper"><textarea id="draft" aria-label="正文" placeholder="从这里写起……" spellcheck="false" wrap="soft"></textarea><div id="mirror" hidden aria-hidden="true"></div><div id="actions" role="group" aria-label="选区快捷操作" hidden><button type="button" id="discuss">讨论</button><button type="button" id="rewrite">改写</button><button type="button" id="verify">查依据</button></div></div></section>
<section><h2>和 AI 讨论</h2><div id="thread"></div><div id="chip"></div><form><input id="ask" aria-label="给 AI 发消息" placeholder="比如：这句怎么说更自然？" autocomplete="off"><button class="primary">发送</button></form><small id="notice" role="status"></small></section></main>
<script>
const examples=[
 ['日落以前','五点以后，图书馆里还有三个人。','靠窗的读者把书翻过一页。管理员经过时，替她开了灯。','五点过了，馆里还剩三个人。'],
 ['我的周末散步路线','我每周六都会绕路去一趟旧馆。','从南门进去，走到窗边，正好能坐在下午的光里。','每到周六，我总要绕去旧馆坐坐。'],
 ['第三章　归还','她把那本书带回来的时候，借书卡已经泛黄了。','借阅台还在原处。她把卡片放在台上，等里面的人抬起头。','她来还书时，借书卡已经黄了。'],
 ['最后一盏灯','内景。阅览室，黄昏。','管理员一排排关灯。走到窗边，他停下来，把手从开关上拿开。','黄昏，阅览室内。']
];
const fresh=(example)=>({title:example[0],draft:example.slice(1,3).join('\n\n'),selection:null,messages:[],revision:0,note:''});
function transition(state, action){
 const s={...state,note:''};
 if(action.type==='select') s.selection={start:action.start,end:action.end,text:s.draft.slice(action.start,action.end),revision:s.revision};
 if(action.type==='clear') s.selection=null;
 if(action.type==='edit') return {...s,draft:action.value,revision:s.revision+1,selection:null};
 if(action.type==='send'){
  const ref=s.selection;
  const rewrite=/改|自然|口语|重写/.test(action.question);
  const match=examples.find(example=>example[1]===ref?.text);
  const suggestion=ref && rewrite ? (match?.[3] ?? '我记得这样的细节：'+ref.text) : null;
  const checking=action.question.includes('参考资料里有依据');
  const answer=checking?(ref?.text.includes('三个人')?'现场笔记《闭馆前的一个小时》写的是“五点，窗边还有三个人”。它支持这个时刻和地点的人数；要写整座馆或五点以后的情况，还需要别的记录。':'这份示例暂时没有为该选段核对出直接依据。'):suggestion?'改写预览：'+suggestion:ref?'你想让读者从这段里记住什么？我们可以先挑一个值得留下的细节。':'可以从一段草稿、一个问题，或一份你想讨论的资料开始。';
  s.messages=[...s.messages,{question:action.question,ref,suggestion,answer}];
 }
 if(action.type==='apply'){
  const msg=s.messages[action.index], ref=msg.ref;
  if(ref.revision!==s.revision) return {...s,note:'稿子已经改过。请重新选中目标文字，再生成改写。'};
  return {...s,draft:s.draft.slice(0,ref.start)+msg.suggestion+s.draft.slice(ref.end),revision:s.revision+1,selection:null,note:'改写已放进稿子。'};
 }
 return s;
}
</script><script>
const el=id=>document.getElementById(id);
const draft=el('draft'),ask=el('ask'),mirror=el('mirror');
const docs=examples.map(fresh);
let active=0,state=docs[0];
function switchDoc(index){
 docs[active]=state;active=index;state=docs[index];ask.value='';render();
}
el('newDoc').onclick=()=>{docs.push(fresh(['','','']));switchDoc(docs.length-1);el('title').focus()};
function listDocs(){
 el('documents').replaceChildren(...docs.map((doc,i)=>{const b=button((i===active?state:doc).title||'无标题',()=>switchDoc(i));if(i===active)b.setAttribute('aria-current','page');return b}));
}
el('title').oninput=e=>{state={...state,title:e.target.value};listDocs()};
function node(tag,text){const item=document.createElement(tag);item.textContent=text;return item}
function button(text,run){const b=node('button',text);b.type='button';b.onclick=run;return b}
function dispatch(action){state=transition(state,action);render()}
function paint(){
 const r=state.selection, actions=el('actions');
 const editing=document.activeElement===draft;
 actions.hidden=true;mirror.hidden=!r;
 if(!r)return;
 const mark=node('mark',r.text);
 mirror.replaceChildren(state.draft.slice(0,r.start),mark,state.draft.slice(r.end));
 mirror.style.height=draft.clientHeight+'px';
 mirror.scrollTop=draft.scrollTop;
 if(editing||actions.contains(document.activeElement)){
  const box=mirror.getBoundingClientRect();
  const line=Array.from(mark.getClientRects()).find(rect=>rect.bottom>box.top&&rect.top<box.bottom);
  if(line){
   actions.hidden=false;
   actions.style.left=Math.min(Math.max(0,line.left-box.left),box.width-actions.offsetWidth)+'px';
   actions.style.top=(line.top-box.top-actions.offsetHeight-4)+'px';
  }
 }
 mirror.hidden=editing;
}
function render(){
 el('title').value=state.title;listDocs();
 if(draft.value!==state.draft)draft.value=state.draft;
 paint();const chip=el('chip');chip.replaceChildren();
 if(state.selection){const remove=button('×',()=>dispatch({type:'clear'}));remove.ariaLabel='移除选区引用';chip.append(remove,'选自稿子 · '+state.selection.text)}else chip.textContent='当前讨论整份稿子';
 const thread=el('thread');thread.replaceChildren();
 state.messages.forEach((m,index)=>{const a=node('article','');if(m.ref)a.append(node('blockquote',m.ref.text));a.append(node('strong',m.question),node('p',m.answer));if(m.suggestion)a.append(button('采用这段改写',()=>dispatch({type:'apply',index})));thread.append(a)});
 thread.scrollTop=thread.scrollHeight;el('notice').textContent=state.note;
}
function capture(){
 if(document.activeElement!==draft)return;
 const start=draft.selectionStart,end=draft.selectionEnd;
 if(end>start)dispatch({type:'select',start,end});
 else if(state.selection)dispatch({type:'clear'});
}
const actions=el('actions');
actions.onmousedown=e=>e.preventDefault();
actions.onfocusout=()=>requestAnimationFrame(paint);
el('discuss').onclick=()=>ask.focus();
function quickAsk(question){ask.focus();dispatch({type:'send',question});}
el('rewrite').onclick=()=>quickAsk('帮我改写这段。');
el('verify').onclick=()=>quickAsk('这段在参考资料里有依据吗？');
draft.onscroll=paint;
window.addEventListener('resize',paint);
draft.onselect=capture;draft.onpointerup=capture;draft.onkeyup=capture;draft.onfocus=paint;draft.onblur=()=>requestAnimationFrame(paint);draft.oninput=()=>dispatch({type:'edit',value:draft.value});
document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!ask.value.trim())return;dispatch({type:'send',question:ask.value.trim()});ask.value='';ask.focus()};
render();
</script></html>
