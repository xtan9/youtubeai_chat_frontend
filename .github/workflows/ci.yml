name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deployment-policy:
    runs-on: ubuntu-latest
    # The tests take seconds, but the job budget also covers runner setup and cleanup.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: >-
          node --test
          scripts/vercel-deployment-policy.policy.mjs
          scripts/vercel-deploy-workflow.policy.mjs
          scripts/production-smoke-workflow.policy.mjs
          scripts/payment-e2e-workflow.policy.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - name: Install Project GA browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify registered Project journey and Free-limit races
        run: >-
          pnpm exec playwright test smoke-tests/e2e-workspace.spec.ts
          --grep '@projects-ga-(critical|race)'
          --workers=1
          --retries=0
          --reporter=line
        env:
          # The spec owns isolated app and Supabase fixture servers. Setting
          # BASE_URL disables Playwright's unrelated global webServer.
          BASE_URL: http://127.0.0.1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Upgrade-path regression guard: replays prod's pre-migration shape and
  # then applies every migration in order. Catches the class of failure
  # where a migration works on a fresh DB (Vitest tests) but breaks on a
  # pre-existing one (what bit us on db-migrate run 24593654019).
  migration-upgrade-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production uses Supabase Queues (PGMQ); keep the upgrade replay on
        # Postgres 15 while exercising the real extension instead of a stub.
        image: ghcr.io/pgmq/pg15-pgmq:v1.10.0
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - name: Load Supabase role + auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
      - name: Load legacy-schema fixture (pre-migration state)
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_schema.sql
      - name: Seed a registered user that predates Workspace migrations
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_registered_user.sql
      - name: Apply migrations in order
        run: |
          set -eo pipefail
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $f"
            if [[ "$(basename "$f")" == "20260809209997_guard_precanonical_video_identity_writes.sql" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_video_identity_before_canonical.sql
            fi
            if [[ "$(basename "$f")" == "20260809232600_project_message_analytics_ordinals.sql" ]]; then
              bash supabase/test-fixtures/regression_project_message_ordinal_rollout.sh "$f"
            elif [[ "$(basename "$f")" == "20260811055120_enforce_project_beta_access_at_database_boundary.sql" ]]; then
              bash supabase/test-fixtures/regression_project_beta_owner_transfer_rollout.sh "$f"
            else
              psql -v ON_ERROR_STOP=1 -f "$f"
            fi
            if [[ "$(basename "$f")" > "20260809232555" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_analytics_least_privilege.sql
            fi
            if [[ "$(basename "$f")" == "20260809209997_guard_precanonical_video_identity_writes.sql" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_precanonical_video_identity_guard.sql
            fi
            if [[ "$(basename "$f")" == "20260809210000_canonical_video_identity_and_private_cache.sql" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_legacy_video_identity_after_canonical.sql
            fi
            if [[ "$f" == *"20260809111726_complete_project_grounded_answer.sql" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_project_grounded_coverage.sql
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_source_set_service_dml_denied.sql
            if [[ "$(basename "$f")" > "20260809210000" ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_grounded_rollout_compatibility.sql
            fi
            echo "::endgroup::"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_video_identity_recovery_fixed_point.sql
      - name: Failed identity repair rolls back every retained row
        run: |
          set -eo pipefail
          createdb identity_repair_rollback
          PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
          PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_schema.sql
          PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_registered_user.sql
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ "$base" > "20260809209998_create_legacy_video_identity_quarantine.sql" ]]; then
              break
            fi
            if [[ "$base" == "20260809209997_guard_precanonical_video_identity_writes.sql" ]]; then
              PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_video_identity_before_canonical.sql
            fi
            PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f "$f"
          done
          for dependency in summary history project chat event; do
            PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -v dependency_kind="$dependency" -f supabase/test-fixtures/seed_legacy_video_identity_unexpected_reference.sql
            if PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260809209999_repair_legacy_video_identity_incident.sql; then
              echo "identity repair unexpectedly accepted $dependency dependency drift"
              exit 1
            fi
            PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -v dependency_kind="$dependency" -f supabase/test-fixtures/assert_legacy_video_identity_repair_rolled_back.sql
            PGDATABASE=identity_repair_rollback psql -v ON_ERROR_STOP=1 -v dependency_kind="$dependency" -f supabase/test-fixtures/clear_legacy_video_identity_unexpected_reference.sql
          done
          dropdb identity_repair_rollback
      - name: Exact identity repair parent-lock race
        run: |
          set -eo pipefail
          createdb identity_repair_lock_race
          PGDATABASE=identity_repair_lock_race psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
          PGDATABASE=identity_repair_lock_race psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_schema.sql
          PGDATABASE=identity_repair_lock_race psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_registered_user.sql
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ "$base" > "20260809209998_create_legacy_video_identity_quarantine.sql" ]]; then
              break
            fi
            if [[ "$base" == "20260809209997_guard_precanonical_video_identity_writes.sql" ]]; then
              PGDATABASE=identity_repair_lock_race psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_video_identity_before_canonical.sql
            fi
            PGDATABASE=identity_repair_lock_race psql -v ON_ERROR_STOP=1 -f "$f"
          done
          PGDATABASE=identity_repair_lock_race \
            bash supabase/test-fixtures/regression_legacy_video_identity_parent_lock.sh \
              supabase/migrations/20260809209999_repair_legacy_video_identity_incident.sql
          dropdb identity_repair_lock_race
      - name: Backdated identity recovery is a real CLI fixed point
        env:
          # Supabase CLI 2.72.7 otherwise attempts TLS against this job's
          # intentionally local plain-Postgres service.
          PGSSLMODE: disable
        run: |
          set -eo pipefail
          createdb identity_recovery_normal
          createdb identity_recovery_late
          for database in identity_recovery_normal identity_recovery_late; do
            PGDATABASE="$database" psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
          done

          normal_url='postgres://postgres:postgres@localhost:5432/identity_recovery_normal'
          late_url='postgres://postgres:postgres@localhost:5432/identity_recovery_late'
          supabase db push --include-all --db-url "$normal_url" --yes

          late_workdir="$(mktemp -d)"
          cp -R supabase "$late_workdir/supabase"
          for migration in \
            20260809209997_guard_precanonical_video_identity_writes.sql \
            20260809209998_create_legacy_video_identity_quarantine.sql \
            20260809209999_repair_legacy_video_identity_incident.sql \
            20260809210025_remove_precanonical_video_identity_guard.sql; do
            rm -f -- "$late_workdir/supabase/migrations/$migration"
          done

          (
            cd "$late_workdir"
            supabase db push --include-all --db-url "$late_url" --yes
          )
          PGDATABASE=identity_recovery_late psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (
                select count(*)
                from supabase_migrations.schema_migrations
                where version in (
                  '20260809209997',
                  '20260809209998',
                  '20260809209999',
                  '20260809210025'
                )
              ) <> 0
              or not exists (
                select 1
                from supabase_migrations.schema_migrations
                where version = '20260809210024'
              )
            then
              raise exception
                'REGRESSION: already-applied CLI ledger boundary drifted';
            end if;
          end;
          $$;
          SQL

          supabase db push --include-all --db-url "$late_url" --yes
          PGDATABASE=identity_recovery_late psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (
              select count(*)
              from supabase_migrations.schema_migrations
              where version in (
                '20260809209997',
                '20260809209998',
                '20260809209999',
                '20260809210025'
              )
            ) <> 4 then
              raise exception
                'REGRESSION: db push --include-all missed a recovery migration';
            end if;
          end;
          $$;
          SQL

          for database in identity_recovery_normal identity_recovery_late; do
            PGDATABASE="$database" psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_video_identity_recovery_fixed_point.sql
          done
          pg_dump --schema-only identity_recovery_normal \
            | sed -E '/^\\(un)?restrict /d' > /tmp/identity-recovery-normal.sql
          pg_dump --schema-only identity_recovery_late \
            | sed -E '/^\\(un)?restrict /d' > /tmp/identity-recovery-late.sql
          diff -u /tmp/identity-recovery-normal.sql /tmp/identity-recovery-late.sql
          dropdb identity_recovery_normal
          dropdb identity_recovery_late
      - name: Workspace and Project contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_workspace_projects.sql
      - name: Project GA database access - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_ga_access.sql
      - name: Project limit concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_limit_concurrency.sql
      - name: Project Source Set contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_sets.sql
      - name: Project Source Set concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_concurrency.sql
      - name: Project passage Search contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search.sql
      - name: Project passage Search concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search_concurrency.sql
      - name: Project Video processing contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing.sql
      - name: Project Video processing concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing_concurrency.sql
      - name: Project Grounded Answer contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answers.sql
      - name: Project Grounded Answer concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answer_concurrency.sql
      - name: Project Conversation management - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_conversation_management.sql
      - name: Project Source Set audit - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_audit.sql
      - name: Project guided synthesis contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_guided_synthesis.sql
      - name: Project Assessment contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_assessment.sql
      - name: Project Study Guide contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_study_guides.sql
      - name: Project Brief contract - representative legacy
