        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_candidate_pairs.sql
      - name: Recommendation Candidate pair concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_candidate_pairs_concurrency.sql
      - name: Recommendation Assessment contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_assessments.sql
      - name: Shadow Recommendation Set contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_shadow_recommendation_sets.sql
      - name: Recommendation Assessment and Set concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_assessments_concurrency.sql
      - name: Anonymous Trial core ledger and concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_anonymous_trial_core.sql
      - name: Registered Free Hero Demo ledger and concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_registered_free_hero_demo_ledger.sql
      - name: Hero Demo conversation retention - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_hero_demo_conversations.sql
      - name: Verify anonymous passive-control contract
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_anonymous_trial_passive_controls.sql
      - name: Workspace and Project contract - fresh migration replay
        run: |
          set -eo pipefail
          createdb workspace_fresh
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $f to fresh database"
            if [[ "$(basename "$f")" == "20260809232600_project_message_analytics_ordinals.sql" ]]; then
              PGDATABASE=workspace_fresh bash supabase/test-fixtures/regression_project_message_ordinal_rollout.sh "$f"
            elif [[ "$(basename "$f")" == "20260811055120_enforce_project_beta_access_at_database_boundary.sql" ]]; then
              PGDATABASE=workspace_fresh bash supabase/test-fixtures/regression_project_beta_owner_transfer_rollout.sh "$f"
            else
              PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f "$f"
            fi
            if [[ "$(basename "$f")" > "20260809232555" ]]; then
              PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_analytics_least_privilege.sql
            fi
            if [[ "$(basename "$f")" == "20260809209997_guard_precanonical_video_identity_writes.sql" ]]; then
              PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_precanonical_video_identity_guard.sql
            fi
            if [[ "$f" == *"20260809111726_complete_project_grounded_answer.sql" ]]; then
              PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_project_grounded_coverage.sql
            fi
            PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_source_set_service_dml_denied.sql
            if [[ "$(basename "$f")" > "20260809210000" ]]; then
              PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_grounded_rollout_compatibility.sql
            fi
            echo "::endgroup::"
          done
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_video_identity_recovery_fixed_point.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_workspace_projects.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_ga_access.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_limit_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_sets.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answers.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answer_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_conversation_management.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_audit.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_guided_synthesis.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_assessment.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_study_guides.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_briefs.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_artifact_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_creator_briefs.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_analytics.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_analytics_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_video_identity_access.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_video_identity_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_catalog_admission.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_catalog_admission_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_structured_semantic_profiles.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_structured_semantic_profiles_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_candidate_pairs.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_recommendation_candidate_pairs_concurrency.sql
