name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deployment-policy:
    runs-on: ubuntu-latest
    # The tests take seconds, but the job budget also covers runner setup and cleanup.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: >-
          node --test
          scripts/vercel-deployment-policy.policy.mjs
          scripts/vercel-deploy-workflow.policy.mjs
          scripts/production-smoke-workflow.policy.mjs
          scripts/payment-e2e-workflow.policy.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Upgrade-path regression guard: replays prod's pre-migration shape and
  # then applies every migration in order. Catches the class of failure
  # where a migration works on a fresh DB (Vitest tests) but breaks on a
  # pre-existing one (what bit us on db-migrate run 24593654019).
  migration-upgrade-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Load Supabase role + auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
      - name: Load legacy-schema fixture (pre-migration state)
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/legacy_schema.sql
      - name: Seed a registered user that predates Workspace migrations
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/pre_migration_registered_user.sql
      - name: Apply migrations in order
        run: |
          set -eo pipefail
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_source_set_service_dml_denied.sql
            echo "::endgroup::"
          done
      - name: Workspace and Project contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_workspace_projects.sql
      - name: Project limit concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_limit_concurrency.sql
      - name: Project Source Set contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_sets.sql
      - name: Project Source Set concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_concurrency.sql
      - name: Project passage Search contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search.sql
      - name: Project passage Search concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search_concurrency.sql
      - name: Project Video processing contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing.sql
      - name: Project Video processing concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing_concurrency.sql
      - name: Project Grounded Answer contract - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answers.sql
      - name: Project Grounded Answer concurrency - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answer_concurrency.sql
      - name: Project Conversation management - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_conversation_management.sql
      - name: Project Source Set audit - representative legacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_audit.sql
      - name: Workspace and Project contract - fresh migration replay
        run: |
          set -eo pipefail
          createdb workspace_fresh
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/supabase_stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $f to fresh database"
            PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f "$f"
            PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/assert_project_source_set_service_dml_denied.sql
            echo "::endgroup::"
          done
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_workspace_projects.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_limit_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_sets.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_passage_search_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_video_processing_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answers.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_grounded_answer_concurrency.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_conversation_management.sql
          PGDATABASE=workspace_fresh psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_project_source_set_audit.sql
      # Reproduces the cache-write upsert that broke translation caching
      # in prod (verified 2026-04-25). Specifically guards against a
      # UNIQUE that conflicts when two summaries differ only by
      # output_language — the exact shape this PR drops. Other conflict
      # shapes need their own fixture.
      #
      # Defense in depth: the assertion in the fixture uses RAISE
      # EXCEPTION (SQLSTATE P0001) which only fails psql when
      # ON_ERROR_STOP=1 is set. We additionally grep stdout for
      # "REGRESSION:" so the step also fails if someone ever drops the
      # flag, or if a future change uses RAISE WARNING by mistake.
      - name: Regression — translation cache upsert succeeds
        run: |
          set -eo pipefail
          output=$(psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_translation_upsert.sql 2>&1)
          echo "$output"
          if echo "$output" | grep -q "REGRESSION:"; then
            echo "::error::Regression fixture detected a failure — see output above" >&2
            exit 1
          fi
      - name: Regression - local payment schema is API-accessible
        run: psql -v ON_ERROR_STOP=1 -f supabase/test-fixtures/regression_payment_e2e_local_schema.sql
