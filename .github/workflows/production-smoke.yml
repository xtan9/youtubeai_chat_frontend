name: production-smoke

# Two triggers:
#  - schedule: catches external drift (YouTube HTML changes, LLM gateway
#    outages) that the deploy health check would miss
#  - workflow_dispatch: manual runs for debugging
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:api
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: api-smoke
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # BASE_URL retargets local-default specs at prod and disables
      # playwright.config's auto-started webServer (pnpm dev would fail
      # in CI without NEXT_PUBLIC_SUPABASE_URL etc.).
      # Run the global-revocation spec separately so every other authenticated
      # check has released this Smoke Account before its sessions are revoked.
      - name: Run non-mutating browser smoke
        run: pnpm exec playwright test --grep-invert "@account-mutating"
        env:
          BASE_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
          PROD_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_NON_ADMIN_EMAIL: ${{ secrets.TEST_NON_ADMIN_EMAIL }}
          TEST_NON_ADMIN_PASSWORD: ${{ secrets.TEST_NON_ADMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Run global sign-out smoke last
        run: pnpm exec playwright test --grep "@account-mutating"
        env:
          BASE_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
          PROD_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
          # These protected values are dedicated Smoke Accounts only; never
          # point them at a personal or other human identity.
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_NON_ADMIN_EMAIL: ${{ secrets.TEST_NON_ADMIN_EMAIL }}
          TEST_NON_ADMIN_PASSWORD: ${{ secrets.TEST_NON_ADMIN_PASSWORD }}
          # Backend Auth controls used only by the recovery smoke's admin API
          # helper; keep the service key protected and never log its value.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
