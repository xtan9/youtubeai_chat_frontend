name: production-smoke

# Two triggers:
#  - schedule: keeps the cheap API health check hourly while running the
#    browser and session-policy journeys once daily. Running the entire
#    Playwright suite hourly creates thousands of production requests and can
#    exhaust the Hobby Fluid CPU allowance.
#  - workflow_dispatch: manual runs for debugging
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      anonymous_trial_smoke_phase:
        description: "Bounded Anonymous Trial rollout probe (run admitted, enable the kill switch, then run killed)"
        required: false
        type: choice
        default: skip
        options:
          - skip
          - admitted
          - killed

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:api
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
      - name: Verify uncached YouTube caption egress
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          VPS_API_KEY: ${{ secrets.VPS_API_KEY }}
          SMOKE_PROFILE: caption-egress
          SMOKE_REQUEST_TIMEOUT_MS: 60000
          SMOKE_REPORT_PATH: test-results/caption-egress-smoke.json
        run: pnpm smoke:caption-egress
      - name: Preserve caption egress evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-caption-egress-evidence
          path: test-results/caption-egress-smoke.json
          if-no-files-found: warn
          retention-days: 30

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: api-smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 15 * * *' }}
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
      PROD_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      # TEST_NON_ADMIN_* is the Free quota/paywall Smoke Account. Keep it
      # separate from the account used for successful live Summary requests.
      TEST_NON_ADMIN_EMAIL: ${{ secrets.TEST_NON_ADMIN_EMAIL }}
      TEST_NON_ADMIN_PASSWORD: ${{ secrets.TEST_NON_ADMIN_PASSWORD }}
      TEST_LIVE_SUMMARY_EMAIL: ${{ secrets.TEST_LIVE_SUMMARY_EMAIL }}
      TEST_LIVE_SUMMARY_PASSWORD: ${{ secrets.TEST_LIVE_SUMMARY_PASSWORD }}
      TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify dedicated live Summary account
        run: pnpm exec tsx smoke-tests/verify-live-summary-account.ts
      # BASE_URL retargets local-default specs at prod and disables
      # playwright.config's auto-started webServer (pnpm dev would fail
      # in CI without NEXT_PUBLIC_SUPABASE_URL etc.). Live Summary journeys
      # use a separate smoke-Pro-entitled non-admin Smoke Account. The Free
      # TEST_NON_ADMIN account remains available to quota/paywall coverage and
      # session-policy checks. Live Summary journeys run without retry: one
      # full live timeout is already strong outage evidence and must not spend
      # the job budget twice.
      - name: Run non-mutating browser smoke
        run: >-
          pnpm exec playwright test
          --grep-invert "@session-policy|@account-mutating|@account-recovery|@live-summary|@payment-e2e"
          --workers=1
          --retries=0
      - name: Run live Summary browser smoke
        if: ${{ !cancelled() }}
        run: >-
          pnpm exec playwright test
          --grep "@live-summary"
          --workers=1
          --retries=0
      - name: Run Project Conversation production smoke
        if: ${{ !cancelled() }}
        run: >-
          pnpm exec playwright test
          smoke-tests/e2e-project-conversation-production.spec.ts
          --grep "@project-grounded"
          --workers=1
          --retries=0
      - name: Run bounded Anonymous Trial rollout probe
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.anonymous_trial_smoke_phase != 'skip' }}
        env:
          ANONYMOUS_TRIAL_PRODUCTION_SMOKE_PHASE: ${{ inputs.anonymous_trial_smoke_phase }}
        run: >-
          pnpm exec playwright test
          smoke-tests/e2e-anonymous-trial-production.spec.ts
          --grep "@anonymous-trial-production"
          --workers=1
          --retries=0
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || cancelled() }}
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Account Recovery and global revocation must start only after every other
  # authenticated browser check has stopped. A separate job preserves that
  # ordering while giving the destructive journey an independent budget even
  # when a real live Summary check correctly reports a production failure.
  session-policy-smoke:
    runs-on: ubuntu-latest
    needs: [api-smoke, e2e-smoke]
    if: ${{ always() && !cancelled() && needs.api-smoke.result == 'success' && needs.e2e-smoke.result != 'skipped' }}
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.PROD_URL || 'https://www.youtubeai.chat' }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_NON_ADMIN_EMAIL: ${{ secrets.TEST_NON_ADMIN_EMAIL }}
      TEST_NON_ADMIN_PASSWORD: ${{ secrets.TEST_NON_ADMIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SESSION_POLICY_EVIDENCE_PATH: test-results/session-policy-evidence.json
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run serial production session policy journey
        run: pnpm exec playwright test smoke-tests/e2e-auth-session-policy.spec.ts --grep "@session-policy" --workers=1 --retries=0
      - name: Preserve redacted session-policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-session-policy-evidence
          path: test-results/session-policy-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || cancelled() }}
        with:
          name: playwright-report-session-policy
          path: |
            playwright-report/
            test-results/
          retention-days: 14
