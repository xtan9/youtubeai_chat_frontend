allowBuilds:
  core-js: set this to true or false
  esbuild: set this to true or false
  unrs-resolver: set this to true or false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.9
  # ESLint 9 and bundled plugins still request minimatch 3, whose
  # brace-expansion 1.x line has no patched release. Minimatch 10 retains
  # the matching APIs these consumers use and resolves the patched 5.x line.
  "minimatch@>=3.0.0 <4.0.0": 10.2.6
  js-yaml: 3.15.0
  postcss: 8.5.25
  sharp: 0.35.3
  vite: 8.0.16
  ws: 8.21.0
