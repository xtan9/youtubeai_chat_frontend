name: production-smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  workspace-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise production workspace in all three interface languages
        env:
          BASE_URL: https://www.youtubeai.chat
          TEST_LIVE_SUMMARY_EMAIL: ${{ secrets.TEST_LIVE_SUMMARY_EMAIL }}
          TEST_LIVE_SUMMARY_PASSWORD: ${{ secrets.TEST_LIVE_SUMMARY_PASSWORD }}
        run: pnpm exec playwright test smoke-tests/verify-live-locale.spec.ts --workers=1 --retries=0 --trace=off
